<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="現場図面帳">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>現場図面帳</title>
  <style>
    :root { --bg: #ECEFF2; --panel: #fff; --text: #18212C; --muted: #5B6878; --border: #D3D9E0; --accent: #1E4D8B; --ng: #D3263A; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151A; --panel: #1A2027; --text: #E5E9EE; --muted: #94A0AD; --border: #2B333C; --accent: #7EA7DF; --ng: #FF5C6F; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; padding: 16px; }
    form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--border); border-top: 4px solid var(--accent);
      border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    input[type=password] { font: inherit; font-size: 18px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text); width: 100%; }
    label.keep { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    button { font: inherit; font-size: 16px; font-weight: 700; padding: 12px; border: none; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #0E1A2B; } }
    button:disabled { opacity: .6; }
    .error { color: var(--ng); min-height: 1.2em; }
  </style>
</head>
<body>
  <form id="unlock" hidden>
    <h1>現場図面帳</h1>
    <p>パスワードを入力してください。</p>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="keep"><input id="keep" type="checkbox" checked> この端末で記憶する（次回から入力不要・圏外でも開けます）</label>
    <button id="go" type="submit">開く</button>
    <p class="error" id="err" role="alert"></p>
  </form>

    var SESSION = "genba-zumen.key.session";   // 記憶しない場合も、開いている間の再読み込みでは聞き直さない
    var OLD = "この端末のブラウザが古いため開けません。iPadOS を 16.4 以降に更新してください。";
    function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function session(v) { try { v === null ? sessionStorage.removeItem(SESSION) : sessionStorage.setItem(SESSION, v); } catch (e) {} }
    function sessionKey() { try { return sessionStorage.getItem(SESSION); } catch (e) { return null; } }
    function raw64(key) {
      return crypto.subtle.exportKey("raw", key).then(function (raw) { return btoa(String.fromCharCode.apply(null, new Uint8Array(raw))); });
    }

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }

    var pending = null;
    function open(key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data)).then(function (buf) {
        if (typeof DecompressionStream === "undefined") throw new Error("nozip");
        return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream(P.z))).arrayBuffer();
      }).then(function (buf) {
        if (pending) session(pending);
        var doc = new TextDecoder().decode(buf);
        document.open();
        document.write(doc);
        document.close();
      });
    }
    function derive(pw) {
      return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(P.salt), iterations: P.iter },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
    }
    function showForm(msg) {
      document.getElementById("unlock").hidden = false;
      document.getElementById("err").textContent = msg || "";
      document.getElementById("pw").focus();
    }

    if (!window.crypto || !crypto.subtle) { showForm("この画面は https で開いてください。"); return; }

    document.getElementById("unlock").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = document.getElementById("go");
      btn.disabled = true; btn.textContent = "確認中…";
      var keep = document.getElementById("keep").checked;
      derive(document.getElementById("pw").value).then(function (key) {
        return raw64(key).then(function (k64) {
          pending = k64;
          return open(key).then(function () { if (keep) store(STORE, k64); });
        });
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = "開く";
        showForm(e && e.message === "nozip" ? OLD : "パスワードが違います。");
      });
    });

    var kept = load(STORE), saved = kept || sessionKey();
    if (saved) {
      crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"]).then(function (key) { pending = saved; return open(key); }).catch(function (e) {
        if (e && e.message === "nozip") { showForm(OLD); return; }
        if (kept) store(STORE, null);   // パスワードが変わった・記憶した鍵が壊れた
        session(null);
        showForm();
      });
    } else {
      showForm();
    }
  })();
